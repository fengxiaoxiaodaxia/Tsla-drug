name: macOS and Linux smoke tests

on:
  push:
    paths:
      - "app/**"
      - "PLATFORMS.md"
      - "install.sh"
      - "fsd-mitm"
      - "scripts/package_release.py"
      - ".gitattributes"
      - ".github/workflows/release-packages.yml"
      - ".github/workflows/platform-smoke.yml"
  pull_request:
    paths:
      - "app/**"
      - "PLATFORMS.md"
      - "install.sh"
      - "fsd-mitm"
      - "scripts/package_release.py"
      - ".gitattributes"
      - ".github/workflows/release-packages.yml"
      - ".github/workflows/platform-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Start services and verify DNS and dashboard
        run: python app/tests/platform_smoke.py
